<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paris Table</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="100 unstarred Paris restaurants on a live walking map.">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Paris Table">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: full-bleed vector map; one floating planner card on top; a draggable sheet at the bottom; two round controls ride above the sheet. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#f2f4f7; --glass:rgba(255,255,255,.86); --ink:#14171c; --muted:#646b78; --faint:#9aa1ad; --line:#e4e7ec;
  --plaque:#1d3b8f; --plaque-edge:#2f7d5b; --route:#2457e6; --me:#1a73e8; --from:#14171c;
  --warn-bg:#fff3d6; --warn-ink:#6f4600; --ok:#1f8a4c; --star:#e0a100;
  --c-bistro:#c0392b; --c-neo:#2f8f5b; --c-street:#e09400; --c-bouillon:#137e98; --c-brasserie:#5b4bc4; --c-wine:#7b1e4b; --c-closed:#9aa1ad;
  --shadow:0 10px 30px rgba(16,24,40,.14), 0 2px 6px rgba(16,24,40,.08);
  --shadow-sm:0 2px 10px rgba(16,24,40,.12);
  --f-ui:"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-name:"Young Serif", Georgia, "Times New Roman", serif;
  --sheet-h:180px; --top-h:84px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111318; --surface:#1b1e25; --surface-2:#242832; --glass:rgba(27,30,37,.86); --ink:#eef0f4; --muted:#a0a8b6; --faint:#6c7483; --line:#2d323c;
    --plaque:#2a4bb0; --plaque-edge:#3c9a70; --route:#6f8dff; --me:#5aa2ff; --from:#eef0f4;
    --warn-bg:#3a2d10; --warn-ink:#ffd78f; --ok:#4cc27e; --star:#ffc53d; --c-closed:#5f6673;
    --shadow:0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35); --shadow-sm:0 2px 10px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--route);outline-offset:2px}
svg{flex:none}
#map{position:fixed;inset:0;background:var(--bg)}
.maplibregl-ctrl-bottom-left{bottom:calc(var(--sheet-h) + 2px);transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
.maplibregl-ctrl-attrib{font-size:10px}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--ink)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}

/* ── Planner card (top) ── */
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center}
.top > *{pointer-events:auto;width:100%;max-width:560px}
.plan{display:flex;align-items:center;gap:12px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:0;border-radius:18px;box-shadow:var(--shadow);padding:8px 8px 8px 10px;text-align:left}
.brand{flex:none;display:grid;place-items:center;width:40px;height:32px;background:var(--plaque);color:#fff;border-radius:6px;border:2px solid #fff;outline:2px solid var(--plaque-edge);font:13px/1 var(--f-name)}
.plan-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding:2px 0}
.plan-row{display:flex;align-items:center;gap:8px;min-width:0}
.plan-row span:last-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan .small{font-size:12.5px;color:var(--muted)}
.plan .big{font-size:17px;font-weight:600}
.plan .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.plan .meta b{color:var(--route);font-weight:700}
.pin-dot{width:9px;height:9px;border-radius:50%;flex:none}
.pin-dot.from{border:2.5px solid var(--from);background:var(--surface)}
.pin-dot.to{background:var(--plaque);border-radius:2px;transform:rotate(45deg)}
.pin-dot.me{background:var(--me);box-shadow:0 0 0 3px color-mix(in srgb,var(--me) 25%,transparent)}
.plan .end{flex:none}

.banner{display:flex;align-items:flex-start;gap:10px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:16px;box-shadow:var(--shadow);padding:12px 6px 12px 14px;font-size:13.5px;line-height:1.4}
.banner span{flex:1;min-width:0}
.banner .act{flex:none;border:0;background:var(--route);color:#fff;border-radius:10px;padding:8px 11px;font-weight:600;font-size:13px;align-self:center}
.banner .icon-btn{width:32px;height:32px;align-self:center}

/* ── Planner (full screen) ── */
.planner{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pl-head{background:var(--surface);box-shadow:var(--shadow-sm);padding:calc(env(safe-area-inset-top,0px) + 8px) max(8px,env(safe-area-inset-right,0px)) 12px max(8px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:4px}
.pl-fields{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;gap:8px;padding-left:22px}
.pl-fields::before{content:"";position:absolute;left:8px;top:22px;bottom:22px;border-left:2px dotted var(--faint)}
.pl-field{position:relative;display:flex;align-items:center;background:var(--surface-2);border-radius:12px;padding:0 4px 0 12px;border:1.5px solid transparent}
.pl-field.active{border-color:var(--route);background:var(--surface)}
.pl-field .pin-dot{position:absolute;left:-19px}
.pl-field input{flex:1;min-width:0;border:0;background:transparent;font:16px/1.2 var(--f-ui);color:var(--ink);padding:12px 0;outline:none}
.pl-field input::placeholder{color:var(--muted)}
.pl-field input.is-me{color:var(--me);font-weight:600}
.pl-field .clr{width:32px;height:32px}
.pl-results{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 20px)}
.pl-sec{padding:14px max(20px,env(safe-area-inset-left,0px)) 6px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:11px max(20px,env(safe-area-inset-right,0px)) 11px max(20px,env(safe-area-inset-left,0px))}
.opt:active{background:var(--surface-2)}
.opt .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.opt .ic.cat{background:var(--cc);color:#fff}
.opt .ic.me{background:color-mix(in srgb,var(--me) 15%,var(--surface));color:var(--me)}
.opt .t{min-width:0;flex:1}
.opt .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{padding:16px max(20px,env(safe-area-inset-left,0px));color:var(--muted);font-size:14px}

/* ── Choose-on-map mode ── */
.pick-cross{position:fixed;z-index:15;left:50%;top:calc(var(--top-h) + (100% - var(--top-h) - var(--sheet-h)) / 2);transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.pickbar{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(16,24,40,.16);display:flex;flex-direction:column;gap:10px;max-width:600px;margin:0 auto}
.pickbar p{margin:0;color:var(--muted);font-size:14px;text-align:center}
.pickbar .row2{display:grid;grid-template-columns:1fr 2fr;gap:10px}

/* ── Floating controls ── */
.fabs{position:fixed;z-index:12;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--sheet-h) + 12px);display:flex;flex-direction:column;gap:10px;transition:bottom .28s cubic-bezier(.2,.8,.2,1)}
.fab{display:grid;place-items:center;width:46px;height:46px;border:0;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow);color:var(--ink)}
.fab svg{width:21px;height:21px}
.fab.on{color:var(--me)}
.fab.follow{background:var(--me);color:#fff}

/* ── Bottom sheet ── */
.sheet{position:fixed;z-index:14;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;height:var(--sheet-h);background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(16,24,40,.14);display:flex;flex-direction:column;transition:height .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.dragging .sheet,.dragging .fabs,.dragging .maplibregl-ctrl-bottom-left{transition:none}
.grab{flex:none;touch-action:none;cursor:grab}
.handle{display:grid;place-items:center;padding:9px 0 4px}
.handle::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
.sh-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:2px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.sh-head h2{margin:0;font:600 19px/1.2 var(--f-ui);letter-spacing:-.01em}
.sh-head .count{color:var(--muted);font-size:13px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px 7px 8px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.plain{padding-left:13px}
.chip .cdot{width:20px;height:20px;border-radius:50%;background:var(--cc);display:grid;place-items:center}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .n{font-weight:500;opacity:.6}
.list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:12px}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--surface-2)}
.rico{width:40px;height:40px;border-radius:12px;background:var(--cc);display:grid;place-items:center;position:relative}
.rico i{position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;border:2px solid var(--surface)}
.rico i.saved{background:var(--star)} .rico i.tried{background:var(--ok)}
.row .nm{font:16px/1.25 var(--f-name);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ds{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rt b{display:block;font-weight:700;font-size:14px}
.row .rt small{color:var(--muted);font-size:12px}
.row .flag{color:var(--warn-ink);font-family:var(--f-ui);font-size:13px}
.empty{padding:16px max(18px,env(safe-area-inset-left,0px));color:var(--muted);font-size:14px}
.more{display:block;margin:8px auto 4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-size:13px;font-weight:600}
.cta{display:flex;align-items:center;gap:12px;margin:0 max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));border:0;background:color-mix(in srgb,var(--route) 10%,var(--surface));border-radius:14px;padding:12px 14px;text-align:left;font-size:14px;flex:none}
.cta b{color:var(--route)}
.cta .ic{width:34px;height:34px;border-radius:50%;background:var(--route);color:#fff;display:grid;place-items:center}

/* Detail */
.detail{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px))}
.photo{position:relative;height:150px;border-radius:16px;background:color-mix(in srgb,var(--cc) 20%,var(--surface)) center/cover no-repeat;display:grid;place-items:center;overflow:hidden;margin-bottom:14px}
.photo .ph-glyph{width:76px;height:76px;border-radius:50%;background:var(--cc);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.photo.has-img{height:190px}
.photo.has-img .ph-glyph{display:none}
.photo .x{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.42);color:#fff;border-radius:50%;width:34px;height:34px}
.photo .credit{position:absolute;left:10px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:6px;text-decoration:none}
.detail h3{margin:0 0 8px;font:25px/1.15 var(--f-name);text-wrap:balance;letter-spacing:-.005em}
.tags{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.plaque{display:inline-block;background:var(--plaque);color:#fff;border:2px solid #fff;outline:2px solid var(--plaque-edge);border-radius:4px;padding:0 7px;font:700 11.5px/1.6 var(--f-ui);letter-spacing:.03em}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tag .cdot{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.dist-line{color:var(--muted);font-size:13.5px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.detail p{margin:0 0 12px;font-size:15px;max-width:60ch}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 0 12px}
.addr{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:14px}
.addr span{flex:1;min-width:0;-webkit-user-select:text;user-select:text}
.go2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px;text-decoration:none;color:var(--ink);padding:0 10px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--route);border-color:var(--route);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn[aria-pressed="true"].save{color:var(--star);border-color:var(--star)}
.btn[aria-pressed="true"].tried{color:var(--ok);border-color:var(--ok)}
.btn svg{width:18px;height:18px}
.mine2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.links .btn{font-size:13px;min-height:40px;border-radius:12px}

/* ── Filter panel ── */
.panel{position:fixed;z-index:50;inset:0;background:rgba(10,14,22,.35);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s}
.panel-card{width:100%;max-width:600px;background:var(--surface);border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.panel-card h2{margin:0;font:600 19px/1.2 var(--f-ui)}
.panel-card h4{margin:18px 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.panel-card .chips{padding:0;flex-wrap:wrap}
.panel-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.legend-note{color:var(--muted);font-size:12.5px;margin:16px 0 0}

/* ── Map pins ── */
.pt-pin{width:34px;height:42px;cursor:pointer}
.pt-pin .drop{position:absolute;inset:0;transform-origin:50% 100%;transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .18s}
.pt-pin .tear{position:absolute;inset:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.pt-pin .tear path{fill:var(--cc);stroke:#fff;stroke-width:2.2}
.pt-pin .gl{position:absolute;left:8px;top:7px;width:18px;height:18px;line-height:0}
.pt-pin .badge{position:absolute;right:-2px;top:-2px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:none}
.pt-pin b{position:absolute;left:32px;top:6px;white-space:nowrap;font:600 12.5px/20px var(--f-ui);color:var(--ink);padding:0 8px;border-radius:8px;background:var(--glass);box-shadow:0 1px 4px rgba(0,0,0,.2);display:none;pointer-events:none}
.z-labels .pt-pin b{display:block}
.z-far .pt-pin .drop{transform:scale(.45)}
.z-13 .pt-pin .drop{transform:scale(.6)}
.z-14 .pt-pin .drop{transform:scale(.8)}
.pt-pin.dim .drop{opacity:.35;transform:scale(.55)}
.pt-pin.dim b{display:none}
.pt-pin.onway .drop{transform:scale(1.12)}
.z-far .pt-pin.onway .drop,.z-13 .pt-pin.onway .drop{transform:scale(.85)}
.pt-pin.onway .tear{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--cc) 75%,transparent)) drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.z-mid .pt-pin.onway b{display:block}
.pt-pin.sel .drop{transform:scale(1.35)!important;opacity:1}
.pt-pin.sel b{display:block}
.pt-pin.saved .badge{display:block;background:var(--star)}
.pt-pin.tried .badge{display:block;background:var(--ok)}
.pt-pin.closed .drop{opacity:.7}

.me-pin{width:24px;height:24px;pointer-events:none;z-index:6}
.me-pin .core{position:absolute;inset:4px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);z-index:2}
.me-pin .pulse{position:absolute;inset:0;border-radius:50%;background:var(--me);opacity:.35;animation:pulse 2s ease-out infinite}
.me-pin .cone{position:absolute;left:-18px;top:-30px;width:60px;height:48px;transform-origin:30px 42px;display:none;background:radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--me) 55%,transparent),transparent 70%);clip-path:polygon(50% 100%,12% 0,88% 0)}
.me-pin.has-heading .cone{display:block}
@keyframes pulse{0%{transform:scale(.6);opacity:.45}100%{transform:scale(2.4);opacity:0}}
.end-pin{width:30px;height:40px;pointer-events:none;z-index:5}
.start-pin{width:22px;height:22px;border-radius:50%;background:var(--surface);border:5px solid var(--from);box-shadow:0 1px 5px rgba(0,0,0,.35);pointer-events:none;z-index:5}

.maplibregl-popup-content{border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);padding:10px;font-family:var(--f-ui)}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--surface)}
.maplibregl-popup-anchor-top .maplibregl-popup-tip{border-bottom-color:var(--surface)}
.tap-pop{display:flex;gap:6px}
.tap-pop button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-weight:600;font-size:13px;white-space:nowrap}
.tap-pop button.go{background:var(--route);border-color:var(--route);color:#fff}

.toast{position:fixed;z-index:60;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translate(-50%,0);background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;transition:opacity .25s,transform .25s}
.toast.off{opacity:0;transform:translate(-50%,-8px);pointer-events:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){ .me-pin .pulse{animation:none} .sheet,.fabs,.pt-pin .drop{transition:none} }
</style>
</head>
<body>
<div id="map" aria-label="Map of Paris restaurants"></div>

<div class="top" id="top">
  <button class="plan" id="plan" aria-label="Plan a walk"></button>
  <div class="banner" id="banner" hidden role="status"></div>
</div>

<div class="fabs" id="fabs">
  <button class="fab" id="btnAll" aria-label="See all restaurants"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/><circle cx="12" cy="12" r="2.5"/></svg></button>
  <button class="fab" id="btnLocate" aria-label="Show my location"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5 3.8 10.6c-.8.3-.7 1.5.1 1.7l6.6 1.6 1.6 6.6c.2.8 1.4.9 1.7.1L20.5 3.5z"/></svg></button>
</div>

<section class="sheet" id="sheet" aria-label="Restaurants">
  <div class="grab" id="grab"><div class="handle"></div><div id="sheetHead"></div></div>
  <div id="sheetBody" style="display:flex;flex-direction:column;min-height:0;flex:1"></div>
</section>

<div class="planner" id="planner" hidden>
  <div class="pl-head">
    <button class="icon-btn" id="plBack" aria-label="Back to map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="pl-fields">
      <label class="pl-field" id="fFrom"><span class="pin-dot from"></span><input id="fromQ" type="text" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Choose a start" aria-label="Walking from"><button class="icon-btn clr" data-clear="from" aria-label="Clear start" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button></label>
      <label class="pl-field" id="fTo"><span class="pin-dot to"></span><input id="toQ" type="text" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Where to?" aria-label="Walking to"><button class="icon-btn clr" data-clear="to" aria-label="Clear destination" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></button></label>
    </div>
    <button class="icon-btn" id="plSwap" aria-label="Swap start and destination"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/></svg></button>
  </div>
  <div class="pl-results" id="plResults"></div>
</div>

<div id="pick" hidden>
  <svg class="pick-cross" width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 43S32 28.6 32 17A15 15 0 0 0 2 17c0 11.6 15 26 15 26z" fill="var(--plaque)" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="17" r="5.5" fill="#fff"/></svg>
  <div class="pickbar"><p id="pickHint">Move the map to place the pin</p><div class="row2"><button class="btn" id="pickCancel">Cancel</button><button class="btn primary" id="pickOk">Set here</button></div></div>
</div>

<div class="panel" id="panel" hidden>
  <div class="panel-card" role="dialog" aria-label="Filters">
    <h2>Filters</h2>
    <h4>Price per person</h4><div class="chips" id="fPrices"></div>
    <h4>My list</h4><div class="chips" id="fMine"></div>
    <p class="legend-note">€ under €20 · €€ €20–50 · €€€ over €50. Grey pins are closed. Press and hold anywhere on the map to walk from or to that spot.</p>
    <div class="panel-foot"><button class="btn" id="fReset">Reset</button><button class="btn dark" id="fDone">Done</button></div>
  </div>
</div>

<div class="toast off" id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
